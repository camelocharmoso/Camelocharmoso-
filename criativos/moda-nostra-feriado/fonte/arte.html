<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0a08;--cream:#f5f1ea;--red:#d8191f;--yel:#f0c73a;--grn:#1f5236}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:var(--h);background:var(--ink);color:var(--cream);font-family:Inter,sans-serif;overflow:hidden;position:relative}
.photo{position:absolute;left:var(--px);top:var(--py);width:var(--pw);height:auto;-webkit-mask-image:linear-gradient(180deg,transparent 0,transparent var(--m1),#000 var(--m2));mix-blend-mode:lighten;filter:saturate(1.1) contrast(1.1) brightness(1.05)}
.shade{position:absolute;inset:0;background:
 linear-gradient(180deg,var(--ink) 0%,var(--ink) var(--s1),rgba(13,10,8,.35) var(--s2),rgba(13,10,8,0) var(--s3),rgba(13,10,8,0) 72%,rgba(13,10,8,.85) 92%,var(--ink) 100%)}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.top{position:absolute;top:44px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:22px;letter-spacing:.32em;text-transform:uppercase}
.logo{width:150px;height:150px;border-radius:50%;box-shadow:0 0 0 3px var(--yel),0 12px 30px rgba(0,0,0,.6)}
.logo b{font-style:normal;font-family:Inter;font-weight:800;font-size:15px;letter-spacing:.4em;display:block;margin-top:-4px;color:var(--red)}
.date{background:var(--grn);color:var(--cream);padding:14px 24px;border-radius:12px;border-top:3px solid var(--yel);border-bottom:3px solid var(--yel)}
.head{position:absolute;left:58px;right:58px;top:var(--ht)}
.kick{font-family:'Instrument Serif';font-style:italic;font-size:var(--k);line-height:1;color:var(--cream)}
.kick em{color:var(--yel)}
.big{font-family:Anton;font-size:var(--b);line-height:.86;letter-spacing:-.005em;text-transform:uppercase;margin-top:6px}
.big span{color:var(--red)}
.seal{position:absolute;right:var(--sr);top:var(--st);width:230px;height:230px;border-radius:50%;background:var(--grn);border:4px solid var(--yel);color:var(--cream);display:grid;place-items:center;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(12deg)}
.seal svg{position:absolute;inset:0}
.seal .c{font-family:Anton;font-size:46px;line-height:.9;text-align:center;text-transform:uppercase}
.seal .c small{display:block;font-family:'Instrument Serif';font-style:italic;text-transform:none;font-size:30px;margin-top:4px}
.foot{position:absolute;left:64px;right:64px;bottom:58px;display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.areas{font-size:19px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;line-height:1.75}
.areas i{font-style:normal;color:var(--yel);margin:0 .35em}
.addr{font-family:'Instrument Serif';font-style:italic;font-size:30px;text-align:right;line-height:1.15;white-space:nowrap}
.addr small{display:block;font-family:Inter;font-style:normal;font-weight:600;font-size:16px;letter-spacing:.28em;text-transform:uppercase;opacity:.7;margin-bottom:6px}
</style></head><body>
<img class="photo" src="forno.jpg">
<div class="shade"></div><div class="grain"></div>
<div class="top"><img class="logo" src="logo.png"><div class="date">02.11 · Finados</div></div>
<div class="head">
 <div class="kick">Feriado? <em>O forno</em> não tira folga.</div>
 <div class="big">Hoje<br><span>estamos</span><br>abertos</div>
</div>
<div class="seal">
 <svg viewBox="0 0 230 230"><defs><path id="r" d="M115,115 m-92,0 a92,92 0 1,1 184,0 a92,92 0 1,1 -184,0"/></defs>
 <text font-family="Inter" font-weight="800" font-size="15.5" letter-spacing="5" fill="#f5ead6"><textPath href="#r">PEÇA JÁ · DELIVERY · PEÇA JÁ · DELIVERY ·</textPath></text></svg>
 <div class="c">Forno<small>aceso</small></div>
</div>
<div class="foot">
 <div class="areas">Piedade<i>✦</i>Candeias<i>✦</i>Barra de Jangada<br>Curcurana<i>✦</i>Paiva</div>
 <div class="addr"><small>Candeias · Jaboatão</small>Av. Pres. Castelo Branco, 6505</div>
</div>
</body></html>
