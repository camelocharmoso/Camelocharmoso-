<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--laranja:#F2652F;--marinho:#15296B;--marinho-esc:#0C1A47;--menta:#D6F0EE;--creme:#F7F3EC}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#111}
.foot{position:absolute;left:76px;right:76px;bottom:120px;height:1px;background:rgba(255,255,255,.18)}
.p{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--marinho);font-family:Barlow,sans-serif;color:#fff}
.foto{position:absolute;left:0;top:0;width:1080px;height:840px;background:url(foto-express.jpg) no-repeat;background-size:1080px auto;background-position:0 -200px}
.logo{position:absolute;right:76px;bottom:48px;width:200px}
.wave{position:absolute;left:0;top:760px;width:1080px;height:140px}
.panel{position:absolute;left:76px;right:76px;top:850px}
.tarja{display:inline-block;font-family:"Barlow Condensed";text-transform:uppercase;font-weight:700;line-height:1;padding:.18em .38em .14em;letter-spacing:.04em}
.t-laranja{background:var(--laranja);color:#fff}
h1{margin-top:22px;font-family:"Barlow Condensed";text-transform:uppercase;line-height:.92;font-size:106px}
h1 .l{font-weight:300}h1 .b{font-weight:800}h1 .o{color:var(--laranja)}
.row{margin-top:26px;display:flex;justify-content:space-between;align-items:flex-end}
.apoio{font-size:28px;line-height:1.3}
.apoio b{font-weight:700}
.wa{font:600 26px Barlow;text-align:right;line-height:1.35}
.wa b{display:block;font:700 34px "Barlow Condensed";letter-spacing:.03em;text-transform:uppercase;color:var(--laranja)}
.nota{position:absolute;left:76px;bottom:44px;font-size:19px;opacity:.65;line-height:1.4}
.lojas{position:absolute;right:76px;bottom:34px;font-size:18px;opacity:.6}
</style></head><body><div class="p">
<div class="foto"></div>
<svg class="wave" viewBox="0 0 1080 140" preserveAspectRatio="none">
 <path d="M0,60 C220,10 400,110 620,60 C820,15 960,70 1080,40 V140 H0 Z" fill="#F2652F"/>
 <path d="M0,82 C220,32 400,132 620,82 C820,37 960,92 1080,62 V140 H0 Z" fill="#D6F0EE"/>
 <path d="M0,100 C220,50 400,150 620,100 C820,55 960,110 1080,80 V140 H0 Z" fill="#15296B"/>
</svg>
<div class="panel">
 <span class="tarja t-laranja" style="font-size:34px">Virtus Express</span>
 <h1><span class="l">Seu óculos novo</span><br><span class="b">em até <span class="o">1 hora.</span></span></h1>
 <div class="row">
  <p class="apoio">Escolheu a armação, trouxe a receita?<br><b>Você sai da loja usando.*</b></p>
  <div class="wa"><b>Chama no WhatsApp</b>(81) 99827-7804</div>
 </div>
</div>
<div class="foot"></div>
<div class="nota">Boa Vista · Iputinga<br>*Para lentes disponíveis em loja. Consulte condições.</div>
<img class="logo" src="logo-virtus-branco.png">
</div></body></html>
