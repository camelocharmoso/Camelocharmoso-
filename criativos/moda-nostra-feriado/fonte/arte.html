<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Oswald:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:var(--h);background:#7a0f12;font-family:Oswald,sans-serif;color:#fff7e8;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(circle at 50% 38%,#b3171c 0,#8e1216 45%,#5c0a0d 100%)}
.flag{position:absolute;top:0;left:0;right:0;height:22px;display:flex}
.flag i{flex:1}.flag i:nth-child(1){background:#1f8a4c}.flag i:nth-child(2){background:#fff7e8}.flag i:nth-child(3){background:#d62828}
.flag.b{top:auto;bottom:0}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 70px;gap:var(--gap)}
.brand{font-family:Pacifico;font-size:78px;line-height:1;color:#ffd166;text-shadow:0 4px 0 #3d0507}
.brand small{display:block;font-family:Oswald;font-size:26px;letter-spacing:10px;color:#fff7e8;margin-top:14px;text-shadow:none}
.tag{background:#ffd166;color:#5c0a0d;font-weight:700;font-size:34px;letter-spacing:6px;padding:10px 34px;border-radius:50px}
h1{font-family:'Abril Fatface';font-size:var(--h1);line-height:.92;text-transform:uppercase;text-shadow:0 8px 0 #3d0507}
h1 span{color:#ffd166}
.pizza{flex-shrink:0;width:var(--pz);height:var(--pz);border-radius:50%;background:
 radial-gradient(circle at 30% 35%,#c1121f 0 26px,transparent 27px),radial-gradient(circle at 64% 30%,#c1121f 0 24px,transparent 25px),
 radial-gradient(circle at 55% 62%,#c1121f 0 28px,transparent 29px),radial-gradient(circle at 30% 68%,#c1121f 0 22px,transparent 23px),
 radial-gradient(circle at 75% 55%,#2d6a4f 0 12px,transparent 13px),radial-gradient(circle at 42% 48%,#2d6a4f 0 11px,transparent 12px),
 radial-gradient(circle at 48% 22%,#2d6a4f 0 10px,transparent 11px),
 radial-gradient(circle,#ffcf6e 0 60%,#f4a83a 70%,#c9772a 80%,#8a4a1c 100%);box-shadow:0 20px 50px rgba(0,0,0,.45)}
p.sub{font-size:40px;font-weight:500;line-height:1.25}
p.sub b{color:#ffd166}
.foot{font-size:26px;letter-spacing:2px;opacity:.95;line-height:1.5}
.foot b{color:#ffd166}
</style></head><body>
<div class="bg"></div><div class="flag"><i></i><i></i><i></i></div><div class="flag b"><i></i><i></i><i></i></div>
<div class="wrap">
 <div class="brand">Moda Nostra<small>PIZZARIA · CANDEIAS</small></div>
 <div class="tag">FERIADO DE FINADOS · 02/11</div>
 <h1>Hoje<br>estamos<br><span>abertos!</span></h1>
 <div class="pizza"></div>
 <p class="sub">Feriado é com pizza quentinha.<br><b>Peça já pelo delivery!</b></p>
 <div class="foot">Entregamos em <b>Piedade · Candeias · Barra de Jangada · Curcurana · Paiva</b><br>Av. Pres. Castelo Branco, 6505 — Candeias</div>
</div></body></html>
