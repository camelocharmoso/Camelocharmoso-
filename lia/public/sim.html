<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador da Lia</title>
<link rel="stylesheet" href="/sim.css">
</head>
<body>
<header>
  <h1>Simulador da Lia</h1>
  <label for="client">Cliente:</label>
  <select id="client"></select>
  <span id="info" class="note flat"></span>
  <form id="loginForm" class="login" hidden>
    <label for="token">Senha do painel:</label>
    <input type="password" id="token" autocomplete="current-password">
    <button>Entrar</button>
  </form>
</header>
<main>
  <section class="pane">
    <h2>Conversa do cliente <small id="who"></small></h2>
    <div class="msgs" id="clientMsgs"></div>
    <form class="compose" id="clientForm">
      <input type="text" id="clientText" placeholder="Escreva como o cliente: faz uma arte do X-Bacon 20% off" autocomplete="off">
      <input type="file" id="photo" accept="image/jpeg,image/png,image/webp" hidden><button type="button" class="ghost" id="photoBtn">Foto</button>
      <button>Enviar</button>
    </form>
  </section>
  <section class="pane">
    <h2>Você, o operador <small>comandos começam com /</small></h2>
    <div class="msgs" id="adminMsgs"></div>
    <form class="compose" id="adminForm">
      <input type="text" id="adminText" placeholder="/add 5581999990000 pro Brasa Burger" autocomplete="off">
      <button>Enviar</button>
    </form>
    <div class="note">Para testar: cadastre um cliente com /add, escolha-o no topo e mande "oi" como cliente. Avisos de posts e tarefas chegam aqui.</div>
  </section>
</main>
<script src="/sim.js" defer></script>
</body>
</html>
