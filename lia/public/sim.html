<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador da Lia</title>
<style>
:root{--bg:#eef1ec;--panel:#fff;--ink:#17211b;--muted:#5b685f;--line:#d6ddd5;--chat:#e8e2d6;--in:#fff;--out:#d5f3c6;--accent:#137a4b;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1411;--panel:#141c18;--ink:#e6ece7;--muted:#97a69c;--line:#26332c;--chat:#0b110e;--in:#1c2620;--out:#15472f;--accent:#42cc8b;--accent-ink:#06140d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0 12px 0 0}
select,input,button{font:inherit}
select,input[type=text]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
button{padding:7px 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;height:calc(100vh - 110px);min-height:480px;overflow:hidden}
.pane h2{font-size:14px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.pane h2 small{color:var(--muted);font-weight:500}
.msgs{flex:1;overflow-y:auto;padding:12px;background:var(--chat);display:flex;flex-direction:column;gap:6px}
.row{display:flex}.row.out{justify-content:flex-end}
.b{max-width:85%;background:var(--in);border-radius:10px;padding:7px 10px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px .5px rgba(0,0,0,.12)}
.row.out .b{background:var(--out)}
.b img{display:block;max-width:240px;width:100%;border-radius:6px}
.b .cap{font-size:12px;color:var(--muted);margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btns button{background:transparent;color:var(--accent);border-radius:16px;padding:5px 12px}
.compose{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.compose input[type=text]{flex:1;min-width:0}
.note{color:var(--muted);font-size:12.5px;padding:8px 14px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Simulador da Lia</h1>
  <label for="client">Cliente:</label>
  <select id="client"></select>
  <span id="info" class="note" style="border:0;padding:0"></span>
</header>
<main>
  <section class="pane">
    <h2>Conversa do cliente <small id="who"></small></h2>
    <div class="msgs" id="clientMsgs"></div>
    <form class="compose" id="clientForm">
      <input type="text" id="clientText" placeholder="Escreva como o cliente: faz uma arte do X-Bacon 20% off" autocomplete="off">
      <label class="ghost" style="display:flex;align-items:center"><input type="file" id="photo" accept="image/*" hidden><button type="button" class="ghost" id="photoBtn">Foto</button></label>
      <button>Enviar</button>
    </form>
  </section>
  <section class="pane">
    <h2>Você, o operador <small>comandos começam com /</small></h2>
    <div class="msgs" id="adminMsgs"></div>
    <form class="compose" id="adminForm">
      <input type="text" id="adminText" placeholder="/add 5581999990000 pro Brasa Burger" autocomplete="off">
      <button>Enviar</button>
    </form>
    <div class="note">Para testar: cadastre um cliente com /add, escolha-o no topo e mande "oi" como cliente. Avisos de posts e tarefas chegam aqui.</div>
  </section>
</main>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const H = token ? { 'x-admin-token': token } : {};
const $ = (s) => document.querySelector(s);
const ADMIN = 'admin';
let after = 0, current = '';
const local = []; // mensagens que você digitou: {to: phone|admin, kind, text, img}
const outbox = [];

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { headers: H });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
const mediaUrl = (f) => `/media/${encodeURIComponent(f)}${token ? `?token=${encodeURIComponent(token)}` : ''}`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const wa = (s) => esc(s).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');

function render() {
  for (const [box, who] of [[$('#clientMsgs'), current], [$('#adminMsgs'), ADMIN]]) {
    const items = [
      ...local.filter((m) => m.to === who).map((m) => ({ ...m, dir: 'out' })),
      ...outbox.filter((m) => m.to === who || (who === ADMIN && m.to === window.ADMIN_PHONE)).map((m) => ({ ...m, dir: 'in' })),
    ].sort((a, b) => a.t - b.t);
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.innerHTML = items.map((m) => {
      let inner = '';
      if (m.img) inner = `<img src="${m.img}" alt="">${m.text ? `<div>${esc(m.text)}</div>` : ''}`;
      else if (m.type === 'image') inner = `<img src="${mediaUrl(m.file)}" alt="Arte">${m.text ? `<div class="cap">${esc(m.text)}</div>` : ''}`;
      else inner = wa(m.text);
      if (m.type === 'buttons') inner += `<div class="btns">${m.buttons.map((b) => `<button type="button" data-id="${esc(b.id)}" data-title="${esc(b.title)}">${esc(b.title)}</button>`).join('')}</div>`;
      return `<div class="row ${m.dir}"><div class="b">${inner}</div></div>`;
    }).join('');
    if (atBottom) box.scrollTop = box.scrollHeight;
  }
}

async function poll() {
  try {
    const msgs = await api(`/sim/outbox?after=${after}`);
    for (const m of msgs) { m.t = performance.now() + m.id / 1e6; outbox.push(m); after = Math.max(after, m.id); }
    if (msgs.length) { render(); refreshClients(); }
  } catch (e) { console.error(e); }
  setTimeout(poll, 900);
}

async function refreshClients() {
  const list = await api('/sim/clients');
  const sel = $('#client');
  const prev = sel.value;
  sel.innerHTML = list.length ? list.map((c) => `<option value="${esc(c.phone)}">${esc(c.business)} · ${esc(c.phone)}</option>`).join('') : '<option value="">nenhum cliente: use /add à direita</option>';
  sel.value = prev && list.some((c) => c.phone === prev) ? prev : (list[0]?.phone || '');
  current = sel.value;
  const c = list.find((x) => x.phone === current);
  $('#info').textContent = c ? `Plano ${c.plan} · ${c.credits} créditos · ${c.onboarded ? 'onboarding feito' : 'onboarding pendente'}` : '';
  $('#who').textContent = current;
  render();
}

function sendClient(body, view) {
  if (!current) return alertBox('Cadastre e escolha um cliente primeiro.');
  local.push({ to: current, t: performance.now(), ...view });
  render();
  return api('/sim/send', { from: current, ...body });
}
function alertBox(t) { local.push({ to: ADMIN, t: performance.now(), text: t }); render(); }

$('#clientForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('#clientText').value.trim();
  if (!text) return;
  $('#clientText').value = '';
  sendClient({ text }, { text });
});
$('#adminForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('#adminText').value.trim();
  if (!text) return;
  $('#adminText').value = '';
  local.push({ to: ADMIN, t: performance.now(), text });
  render();
  api('/sim/send', { asAdmin: true, text });
});
$('#photoBtn').addEventListener('click', () => $('#photo').click());
$('#photo').addEventListener('change', (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const url = rd.result;
    const caption = $('#clientText').value.trim(); $('#clientText').value = '';
    sendClient({ text: caption, image: { base64: url.split(',')[1], mime: f.type || 'image/jpeg' } }, { img: url, text: caption });
  };
  rd.readAsDataURL(f);
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('.btns button');
  if (!b) return;
  sendClient({ buttonId: b.dataset.id, buttonTitle: b.dataset.title }, { text: b.dataset.title });
});
$('#client').addEventListener('change', refreshClients);

refreshClients().then(poll);
</script>
</body>
</html>
